name: Firmware CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: firmware-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PLATFORMIO_DISABLE_PROGRESSBAR: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: pip install "platformio>=6.1,<6.2"

      - name: Run native tests
        run: pio test -e native

      - name: Test remote OTA failure handling
        run: |
          g++ -std=c++17 -Wall -Wextra tests/remote_ota_host.cpp -o /tmp/remote-ota-test
          /tmp/remote-ota-test

      - name: Check dashboard syntax
        run: |
          php -l server/index.php
          node --check server/assets/dashboard.js
          python tests/remote_backend_test.py

      - name: Build ESP32 firmware
        run: pio run -e esp32

      - name: Package firmware
        run: sha256sum .pio/build/esp32/firmware.bin > .pio/build/esp32/firmware.bin.sha256

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: albasqueeze-esp32-firmware
          path: |
            .pio/build/esp32/firmware.bin
            .pio/build/esp32/firmware.bin.sha256
